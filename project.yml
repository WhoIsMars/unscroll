name: Unscroll
options:
  deploymentTarget:
    iOS: "17.0"
packages:
  UnscrollCore:
    path: Packages/UnscrollCore
targets:
  Unscroll:
    type: application
    platform: iOS
    sources: [App]
    dependencies:
      - package: UnscrollCore
    settings:
      base:
        # Con l'account Apple gratuito il bundle id deve essere unico: il suffisso del team lo rende tale.
        PRODUCT_BUNDLE_IDENTIFIER: org.unscroll.app.$(DEVELOPMENT_TEAM)
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_CFBundleDisplayName: unscroll
        CODE_SIGN_STYLE: Automatic
        TARGETED_DEVICE_FAMILY: 1
        MARKETING_VERSION: 0.1.0
        CURRENT_PROJECT_VERSION: 1
        SWIFT_VERSION: 5.0
